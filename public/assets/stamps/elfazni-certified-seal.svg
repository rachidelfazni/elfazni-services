<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <path id="sealTopCircle" d="M 45,160 A 115,115 0 1,1 275,160" fill="none" />
    <path id="sealBottomCircle" d="M 275,160 A 115,115 0 1,1 45,160" fill="none" />
  </defs>

  <g transform="rotate(4 160 160)">
    <!-- Outer scalloped decorative ring -->
    <circle cx="160" cy="160" r="150" fill="none" stroke="#CC9048" stroke-width="3" stroke-dasharray="8,4" opacity="0.95" />
    <circle cx="160" cy="160" r="142" fill="none" stroke="#0B2E57" stroke-width="3.5" opacity="0.9" />
    <circle cx="160" cy="160" r="98" fill="none" stroke="#CC9048" stroke-width="2" opacity="0.85" />

    <!-- Top curved text -->
    <text fill="#0B2E57" font-family="'Bahij TheSansArabic', Cairo, Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="1.5">
      <textPath href="#sealTopCircle" startOffset="50%" text-anchor="middle">
        ✦ خاتم التوثيق والاعتماد · ELFAZNI SERVICES ✦
      </textPath>
    </text>

    <!-- Bottom curved text -->
    <text fill="#0B2E57" font-family="Arial, sans-serif" font-weight="800" font-size="11" letter-spacing="2">
      <textPath href="#sealBottomCircle" startOffset="50%" text-anchor="middle">
        ✦ CERTIFIED & AUTHENTICATED DOCUMENT ✦
      </textPath>
    </text>

    <!-- Center Emblem -->
    <circle cx="160" cy="160" r="70" fill="#CC9048" fill-opacity="0.12" stroke="#CC9048" stroke-width="1.8" />
    <text x="160" y="152" text-anchor="middle" fill="#CC9048" font-family="'Bahij TheSansArabic', Cairo, Arial, sans-serif" font-weight="900" font-size="20">
      مـصـادق عـلـيـه
    </text>
    <text x="160" y="172" text-anchor="middle" fill="#0B2E57" font-family="Arial, sans-serif" font-weight="800" font-size="9" letter-spacing="1.5">
      VERIFIED · SECURE
    </text>
    <text x="160" y="190" text-anchor="middle" fill="#0B2E57" font-family="Arial, sans-serif" font-weight="600" font-size="8">
      OPERATIONS DESK
    </text>
  </g>
</svg>
