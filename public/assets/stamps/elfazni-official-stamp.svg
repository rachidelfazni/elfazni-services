<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Circular path for top text -->
    <path id="topCircle" d="M 40,160 A 120,120 0 1,1 280,160" fill="none" />
    <!-- Circular path for bottom text -->
    <path id="bottomCircle" d="M 280,160 A 120,120 0 1,1 40,160" fill="none" />
    
    <filter id="stampDistort" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g transform="rotate(-6 160 160)" filter="url(#stampDistort)">
    <!-- Outer solid circle -->
    <circle cx="160" cy="160" r="148" fill="none" stroke="#004AA5" stroke-width="4.5" stroke-dasharray="800" opacity="0.9" />
    
    <!-- Outer decorative dashed circle -->
    <circle cx="160" cy="160" r="140" fill="none" stroke="#004AA5" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.85" />

    <!-- Inner boundary circle -->
    <circle cx="160" cy="160" r="96" fill="none" stroke="#004AA5" stroke-width="2.5" opacity="0.9" />

    <!-- Top curved text -->
    <text fill="#004AA5" font-family="'Bahij TheSansArabic', Cairo, Arial, sans-serif" font-weight="900" font-size="13.5" letter-spacing="1.5" opacity="0.92">
      <textPath href="#topCircle" startOffset="50%" text-anchor="middle">
        ★ ELFAZNI SERVICES SARL · مجموعة الفزني للخدمات ★
      </textPath>
    </text>

    <!-- Bottom curved text -->
    <text fill="#004AA5" font-family="'Bahij TheSansArabic', Cairo, Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2" opacity="0.92">
      <textPath href="#bottomCircle" startOffset="50%" text-anchor="middle">
        ★ CASABLANCA · ISTANBUL · RIYADH ★
      </textPath>
    </text>

    <!-- Center Box / Shield -->
    <rect x="70" y="125" width="180" height="70" rx="6" fill="#004AA5" fill-opacity="0.08" stroke="#004AA5" stroke-width="2" stroke-dasharray="3,2" />

    <!-- Center horizontal banner lines -->
    <line x1="72" y1="135" x2="248" y2="135" stroke="#004AA5" stroke-width="1.2" opacity="0.7" />
    <line x1="72" y1="185" x2="248" y2="185" stroke="#004AA5" stroke-width="1.2" opacity="0.7" />

    <!-- Center text: Arabic 'APPROVED' -->
    <text x="160" y="162" text-anchor="middle" fill="#004AA5" font-family="'Bahij TheSansArabic', Cairo, Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="1" opacity="0.95">
      مـعـتـمـد
    </text>

    <!-- Center subtext: English 'OFFICIALLY APPROVED' -->
    <text x="160" y="179" text-anchor="middle" fill="#004AA5" font-family="Arial, sans-serif" font-weight="800" font-size="9" letter-spacing="2" opacity="0.9">
      OFFICIALLY APPROVED
    </text>

    <!-- Metadata subline -->
    <text x="160" y="218" text-anchor="middle" fill="#004AA5" font-family="Arial, sans-serif" font-weight="700" font-size="8" letter-spacing="1" opacity="0.8">
      RC: 489201 · IF: 39021844
    </text>

    <!-- Little star emblems -->
    <polygon points="160,102 163,110 171,110 165,115 167,123 160,118 153,123 155,115 149,110 157,110" fill="#004AA5" opacity="0.85" />
  </g>
</svg>
